name: Create Staging PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0 # Critical: Must fetch all history to find tags

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: production
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Enable yarn cache
        uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          cache-dependency-path: 'source/yarn.lock'

      - name: Install Dependencies
        run: |
          cd source

          yarn

      - name: Generate Changelog
        id: gen_changelog
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd source

          LAST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")
          COUNT=`git rev-list --count $(git describe --tags --match "v*" --abbrev=0)..HEAD`

          yarn gen-changelog -q > changelogs/latest.md

          # Check if latest.md is empty or only whitespace.
          if [ -s "changelogs/latest.md" ]; then
            echo "Generated changelogs/latest.md changelog has content."
          else
            if [ -f "changelogs/latest.md" ]; then
              echo "Deleting empty changelogs/latest.md."
              rm changelogs/latest.md
            fi
          fi

          yarn update:docs:changelog

          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Mess about with branches
        run: |
          rm -rf source/.git/
          mv production/.git source/

      - name: Commit Changes
        id: commit_changes
        run: |
          cd source

          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit changes.
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "ci: stage PR."
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Staging Branch
        if: steps.commit_changes.outputs.changes == 'true'
        id: create_branch
        run: |
          cd source

          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="staging-${SHORT_SHA}"

          # Create branch.
          git checkout -b "$BRANCH_NAME"

          # Push branch
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.commit_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_CREATE_PR }}
        run: |
          cd source

          COMMIT_COUNT=${{ steps.gen_changelog.outputs.commit_count }}
          BRANCH_NAME=${{ steps.create_branch.outputs.branch_name }}
          LAST_TAG=${{ steps.gen_changelog.outputs.last_tag }}
          TITLE="Staging for release: $LAST_TAG"

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            # Read the file content into a variable for the PR body
            BODY_CONTENT=$(cat changelogs/latest.md)
            TITLE+=" + Unreleased Changes"
          else
            BODY_CONTENT="Release $LAST_TAG of PhLynx."
          fi

          gh pr create \
            --base production \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "$BODY_CONTENT" \
            --draft=false
